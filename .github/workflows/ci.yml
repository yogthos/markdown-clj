name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Clojure tools
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
          lein: 2.9.3
          bb: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-deps-${{ hashFiles('project.clj', 'deps.edn', 'bb.edn', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Run tests
        run: lein test
